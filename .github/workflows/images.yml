name: Images

# main builds, tests and pushes :sha-<short>, with attested provenance
# (docs/packaging/spec.md). Adapted from civil-os's images.yml.
on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: images-${{ github.ref }}
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/civil-labs/opencama-record-keeper

jobs:
  build:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      attestations: write
      id-token: write
    env:
      # promote computes the same sha-<7> tag; pinned so they can't drift.
      DOCKER_METADATA_SHORT_SHA_LENGTH: "7"
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE }}
          # Never publish :latest.
          flavor: latest=false
          tags: |
            type=sha,prefix=sha-
      - id: push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          platforms: linux/amd64
          # The same scope as ci.yml's image job, so each reuses the other's layers.
          cache-from: type=gha,scope=image
          cache-to: type=gha,mode=max,scope=image
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true
      # Test the image that was published, not a local rebuild.
      - name: Test the pushed image
        run: sh scripts/image-test.sh "$IMAGE@${{ steps.push.outputs.digest }}"
