# Serves the production build (docs/packaging/spec.md, "Serving" and "Headers").
# Installed as /etc/nginx/conf.d/default.conf, inside the base image's http block.

server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    server_tokens off;

    # MapLibre's worker is assets/maplibre-<hash>.mjs, loaded as a module
    # worker, and browsers refuse a module script served as
    # application/octet-stream. The base image's mime.types has no .mjs entry.
    # A types block replaces the inherited map rather than adding to it, so the
    # base map is included again here first; types blocks at one level add up.
    include /etc/nginx/mime.types;
    types {
        application/javascript mjs;
    }

    gzip on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # nginx only inherits add_header into a location that has none of its own,
    # so every location below repeats the shared headers. The CSP leaves out
    # connect-src and img-src, which name the instance's gateway, IdP and
    # basemap; a deployment adds them at its ingress.
    set $csp "script-src 'self'; style-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'none'; form-action 'none'";

    # Content-hashed files: cached for a year. A missing one is a 404, never
    # index.html, so a stale page asking for an old asset fails clearly.
    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header Content-Security-Policy $csp always;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
    }

    # Checked on every load, so a changed ConfigMap is picked up on the next one.
    location = /config.json {
        try_files $uri =404;
        add_header Cache-Control no-cache always;
        add_header Content-Security-Policy $csp always;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
    }

    # index.html, and the SPA fallback: every other path loads the app, and a
    # new release is picked up on the next load.
    location / {
        try_files $uri /index.html;
        add_header Cache-Control no-cache always;
        add_header Content-Security-Policy $csp always;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
    }
}
